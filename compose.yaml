# Keep the legacy project namespace so the existing named volume is preserved.
name: samsyn

services:
  verify:
    build: .
    image: ${IMAGE_NAME:-verify:dev}
    restart: unless-stopped
    ports:
      # Development only: keep the mock-identity app on loopback.
      - "127.0.0.1:8080:8080"
    environment:
      # First-visit theme: dark, light or system. A saved toggle choice wins.
      APP_THEME: ${APP_THEME:-dark}
      AUTH_MODE: dev
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me-please-32-chars-minimum}
      COOKIE_SECURE: "0"
      DATA_DIR: /data
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      PORT: "8080"
    volumes:
      - samsyn-data:/data

volumes:
  samsyn-data:
